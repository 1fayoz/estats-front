name: my-stats-front

# Frontend konteyneri — faqat localhost'ga bog'lanadi, tashqariga host'dagi
# nginx orqali chiqadi (estats.uz). Backend alohida compose loyihasida.
services:
  front:
    image: ${FRONT_IMAGE:-ghcr.io/1fayoz/estats-front:latest}
    container_name: my-stats-front
    ports:
      - "127.0.0.1:8071:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    # Loglar cheklanmasa disk to'ladi. Bu server umumiy, shuning uchun
    # /etc/docker/daemon.json ga tegilmaydi (u demonni qayta ishga tushirib,
    # boshqa loyihalarni ham uzadi) — cheklov shu yerda, faqat o'zimizga.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
