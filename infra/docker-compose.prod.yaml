name: my-stats-front

# Frontend konteyneri — faqat localhost'ga bog'lanadi, tashqariga host'dagi
# nginx orqali chiqadi (estats.uz). Backend alohida compose loyihasida.
services:
  front:
    image: ${FRONT_IMAGE:-ghcr.io/1fayoz/estats-front:latest}
    container_name: my-stats-front
    # Xotira chegarasi (2026-09-30, prodda o'lchangan cho'qqi sarfdan). Serverda
    # 7,7 GB RAM va besh mahsulot: chegarasiz bitta konteyner hammasini swap'ga
    # itarardi. Oshsa avval swap'ga o'tadi (memswap), darhol o'ldirilmaydi.
    mem_limit: 512m
    memswap_limit: 768m
    ports:
      - "127.0.0.1:8071:3000"
    environment:
      NODE_ENV: production
      # next-auth sessiya cookie'sini shifrlaydi. Serverdagi `infra/.env` da
      # turadi (rsync uni o'chirmaydi, repoda yo'q); bo'lmasa deploy to'xtaydi.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET infra/.env da bo'lishi kerak}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://estats.uz}
    restart: unless-stopped
    # Loglar cheklanmasa disk to'ladi. Bu server umumiy, shuning uchun
    # /etc/docker/daemon.json ga tegilmaydi (u demonni qayta ishga tushirib,
    # boshqa loyihalarni ham uzadi) — cheklov shu yerda, faqat o'zimizga.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
