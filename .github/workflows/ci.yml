name: CI

# Har push'da tekshiruv; `main` ga tushganda image GHCR'ga yig'iladi.
# Deploy alohida workflow (deploy.yml) — u shu CI muvaffaqiyatli tugagach ketadi.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck va build
    runs-on: ubuntu-latest
    env:
      # Build vaqtida NEXT_PUBLIC_* qiymatlari bundle'ga kiradi. CI'da bu faqat
      # kompilyatsiya uchun — haqiqiy qiymat image build bosqichida beriladi.
      NEXT_PUBLIC_API_URL: https://stats.chatx.uz/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next build
        run: npm run build

  build:
    name: Image build va push
    runs-on: ubuntu-latest
    needs: [check]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # GHCR faqat kichik harfli nomni qabul qiladi.
      - run: echo "IMAGE=${IMAGE,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://stats.chatx.uz/api/v1' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
